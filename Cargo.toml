[workspace]
members = [
    "hummingbird-cli",
    "hummingbird-agent",
    "hummingbird-context",
    "hummingbird-inference",
    "hummingbird-tools",
    "hummingbird-forge",
    "hummingbird-common",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hummingbird Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
toml = { version = "0.8", features = ["display"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1"
walkdir = "2"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
